{% load static %}
<!doctype html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Boristene ETS - Ukrainian-Italian Cultural Diplomacy, Milan{% endblock %}</title>

  <meta name="description" content="{% block meta_description %}Boristene ETS is a Milan-based association promoting Ukrainian culture, history and heritage in Italy.{% endblock %}">
  <meta property="og:title" content="{% block og_title %}{{ block.super }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Boristene ETS promotes Ukrainian culture, history and heritage in Italy.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=23">

  {% block extra_css %}{% endblock %}

  <link rel="icon" type="image/png" href="{% static 'images/Logo/PNG/Boristene_Mark_Orange.png' %}">

  {% block extra_head %}{% endblock %}
</head>

<body>
  {% block content %}{% endblock %}

  <script src="{% static 'js/navigation.js' %}" defer></script>
  <script src="{% static 'js/main.js' %}?v=10" defer></script>
  <script src="{% static 'js/project-support.js' %}?v=2" defer></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
