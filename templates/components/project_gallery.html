{% load i18n %}
{% load boristene_cms %}
<section class="project-gallery" id="gallery" data-project-gallery aria-labelledby="gallery-title">
  <header class="project-gallery-head">
    <h2 id="gallery-title">{% cms_text "landing.project-detail.t0021" %}</h2>
    <div class="project-gallery-controls">
      <button type="button" data-gallery-scroll="-1" aria-label="{% translate 'Scroll to previous photos' %}" aria-controls="gallery-track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <button type="button" data-gallery-scroll="1" aria-label="{% translate 'Scroll to next photos' %}" aria-controls="gallery-track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </div>
  </header>
  <div class="project-gallery-track" id="gallery-track" tabindex="0" aria-labelledby="gallery-title">
    {% for photo in photos %}
      <a class="project-gallery-item" href="{{ photo.image.url }}" data-gallery-item data-caption="{{ photo.localized.caption }}" aria-label="{% blocktranslate with number=forloop.counter total=photos|length %}Open photo {{ number }} of {{ total }}{% endblocktranslate %}{% if photo.localized.caption %}: {{ photo.localized.caption }}{% endif %}">
        <img src="{{ photo.image.url }}" alt="{{ photo.localized.caption|default:project.localized.title }}" loading="lazy" decoding="async">
        {% if photo.localized.caption %}<span class="project-gallery-caption">{{ photo.localized.caption }}</span>{% endif %}
      </a>
    {% endfor %}
  </div>
  <dialog class="project-photo-viewer" aria-label="{{ project.localized.title }} — {% translate 'photo gallery' %}" data-photo-viewer>
    <button class="photo-viewer-close" type="button" data-photo-close aria-label="{% translate 'Close photo viewer' %}" autofocus>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <button class="photo-viewer-prev" type="button" data-photo-step="-1" aria-label="{% translate 'Previous photo' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
    </button>
    <figure class="photo-viewer-figure">
      <img data-photo-image alt="">
      <figcaption class="photo-viewer-caption" aria-live="polite">
        <span data-photo-caption></span>
        <span data-photo-count></span>
      </figcaption>
    </figure>
    <button class="photo-viewer-next" type="button" data-photo-step="1" aria-label="{% translate 'Next photo' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
    </button>
  </dialog>
</section>
